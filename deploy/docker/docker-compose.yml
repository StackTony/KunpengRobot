# 鲲鹏运维平台 - Docker Compose 部署
# 使用: docker compose up -d
# 镜像支持 linux/amd64 + linux/arm64 双架构 (buildx 构建)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kunpeng
      POSTGRES_PASSWORD: kunpeng
      POSTGRES_DB: kunpeng
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kunpeng"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: api
    environment: &backend_env
      DATABASE_URL: postgresql+asyncpg://kunpeng:kunpeng@postgres:5432/kunpeng
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-CHANGE-ME-IN-PRODUCTION}
      LLM_API_BASE: ${LLM_API_BASE:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    volumes:
      - app_data:/srv/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      replicas: 1   # 压力增大时增加 (无状态, 可横向扩)
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: worker
    environment:
      <<: *backend_env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-8}
    volumes:
      - app_data:/srv/app/data
    depends_on:
      - api
    deploy:
      replicas: 2   # 分析负载增大时增加
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  app_data:
